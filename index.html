<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>프로젝트 시작 질문지 — ASOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#0C2141; --brand:#0040C8; --bright:#246BFE; --pale:#EAF1FF;
  --ground:#FFFFFF; --panel:#F7F8FA; --ink:#0C2141; --ink-2:#5A6478;
  --rule:#D5DCE8; --rule-soft:#E8ECF3; --ok:#0E8A5F; --error:#C8102E;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Pretendard,"Pretendard Variable",Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:18px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,li,label{margin:0}
ul{padding:0;list-style:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bright);outline-offset:3px;border-radius:3px}
a{color:var(--bright)}
[hidden]{display:none!important}

/* ── 로그인 ───────────────────────────── */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-in{width:100%;max-width:460px}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.logo svg{width:30px;height:auto;color:var(--brand);display:block}
.logo span{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--ink-2)}
.gate h1{font-size:34px;font-weight:300;line-height:1.25;letter-spacing:-.04em;margin-bottom:14px}
.gate h1 b{font-weight:700}
.gate .desc{color:var(--ink-2);font-size:17px;margin-bottom:32px}
.field{margin-bottom:16px}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:8px}
.field .hint{font-size:15px;color:var(--ink-2);font-weight:400;margin-top:6px;display:block}
input[type=text],input[type=email],input[type=url],input[type=tel],textarea,select{
  width:100%;background:var(--ground);border:1.5px solid var(--rule);border-radius:4px;
  padding:0 16px;height:56px;transition:border-color .12s}
textarea{height:auto;min-height:118px;padding:14px 16px;line-height:1.65;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--brand);outline:none}
input::placeholder,textarea::placeholder{color:#9AA4B8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:60px;padding:0 28px;border:0;border-radius:4px;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--brand);color:#fff;width:100%}
.btn:hover{background:#0037AC}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.ghost:hover{background:var(--pale)}
.btn.sm{height:48px;padding:0 20px;font-size:16px;width:auto}
.msg{margin-top:18px;padding:16px 18px;border-radius:4px;font-size:16px;line-height:1.6}
.msg.ok{background:var(--pale);color:var(--navy)}
.msg.err{background:#FDECEF;color:var(--error)}
.gate .fine{margin-top:32px;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15px;color:var(--ink-2);line-height:1.65}

/* ── 앱 ───────────────────────────────── */
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding:14px 24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .logo{margin:0;flex:0 0 auto}
.top .who{font-size:15px;color:var(--ink-2);margin-left:auto}
.save-state{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rule)}
.save-state.saving::before{background:#D9A400}
.save-state.saved::before{background:var(--ok)}
.linkbtn{background:none;border:0;color:var(--bright);font-size:15px;cursor:pointer;padding:4px}

.bar{height:3px;background:var(--rule-soft)}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}

.shell{max-width:1120px;margin:0 auto;padding:0 24px;
  display:grid;grid-template-columns:250px 1fr;gap:48px;align-items:start}
.side{position:sticky;top:96px;padding:36px 0}
.side ol{list-style:none;padding:0;margin:0}
.side li{margin-bottom:2px}
.side button{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:11px 14px;border-radius:4px;font-size:16px;color:var(--ink-2);
  display:flex;align-items:center;gap:11px;line-height:1.4}
.side button:hover{background:var(--panel);color:var(--ink)}
.side button[aria-current="true"]{background:var(--pale);color:var(--brand);font-weight:600}
.side .n{font-family:var(--mono);font-size:12px;flex:0 0 auto;width:18px}
.side .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 auto}
.side button.done .dot{background:var(--ok)}

.main{padding:36px 0 96px;min-width:0}
.step-h{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:14px}
.main h2{font-size:32px;font-weight:300;line-height:1.25;letter-spacing:-.04em;max-width:20ch}
.main h2 b{font-weight:700}
.main .intro{margin-top:14px;color:var(--ink-2);font-size:17px;max-width:56ch}
.qs{margin-top:38px}
.warn{margin-top:22px;padding:18px 20px;border-radius:5px;
  background:#FFF3CD;color:#6B4E00;box-shadow:inset 0 0 0 1px #F0DFA8;
  font-size:17px;line-height:1.65;max-width:62ch}
.warn b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:6px;font-weight:700}
.warn strong{font-weight:800}
.ref{margin-top:40px;padding:24px;border-radius:5px;background:var(--panel);
  box-shadow:inset 0 0 0 1px var(--rule-soft)}
.ref h4{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 14px;font-weight:600}
.ref .scroll{overflow-x:auto}
.ref table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;line-height:1.5}
.ref th,.ref td{text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid var(--rule-soft);
  vertical-align:top;white-space:nowrap}
.ref th{font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.ref td:first-child{white-space:normal;min-width:150px}
.ref tr:last-child td{border-bottom:0}
.ref .now{color:var(--brand);font-weight:700}
.ref .y{color:var(--brand);font-weight:700}
.ref .n{color:#B4BCCB;font-weight:700}
.ref .p{color:#B07800;font-weight:700}
.ref td em{font-style:normal;color:var(--ink-2);font-weight:400;margin-left:4px;font-size:14px}
.ref col.hl{background:var(--pale)}
.ref p{margin-top:14px;font-size:16px;line-height:1.65;color:var(--ink-2)}
.q{padding:26px 0;border-top:1px solid var(--rule-soft)}
.q:first-child{border-top:0;padding-top:8px}
.q .lab{display:block;font-size:19px;font-weight:600;line-height:1.5;margin-bottom:6px}
.q .req{color:var(--brand);font-size:15px;margin-left:6px}
.q .help{font-size:16px;color:var(--ink-2);margin-bottom:14px;line-height:1.6}
.q .easy{font-size:16px;line-height:1.65;color:var(--ink-2);background:var(--panel);
  border-radius:4px;padding:14px 16px;margin:10px 0 14px}
.q .easy b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brand);margin-bottom:5px;font-weight:600}
.q .ex{font-size:16px;line-height:1.65;color:var(--ink-2);margin-top:12px;
  padding-left:14px;border-left:2px solid var(--rule)}
.q .ex b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.side .grp{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:20px 14px 8px;pointer-events:none}
.side li.grp:first-child{padding-top:0}
.closing{margin-top:10px}
.closing li{font-size:17px;line-height:1.6;padding:7px 0 7px 20px;position:relative}
.closing li::before{content:"—";position:absolute;left:0;color:var(--brand)}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:4px;
  border:1.5px solid var(--rule);cursor:pointer;font-size:16px;line-height:1.3;background:var(--ground)}
.opt:hover{border-color:var(--bright)}
.opt input{width:17px;height:17px;accent-color:var(--brand);margin:0;flex:0 0 auto}
.opt.on{border-color:var(--brand);background:var(--pale);color:var(--brand);font-weight:600}
.nav{display:flex;gap:12px;margin-top:44px;padding-top:26px;border-top:1px solid var(--rule)}
.nav .sp{flex:1}

.done-card{margin-top:38px;padding:32px;border-radius:6px;background:var(--pale)}
.done-card h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.done-card p{font-size:17px;line-height:1.7;max-width:56ch}
.done-card p+p{margin-top:12px}

.foot{border-top:1px solid var(--rule);padding:28px 24px 56px;
  font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:center;letter-spacing:.05em}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:0}
  .side{position:static;padding:20px 0 0;border-bottom:1px solid var(--rule-soft);min-width:0}
  .side ol{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px}
  .side li{flex:0 0 auto}
  .side li.grp{display:none}
  .side button{white-space:nowrap;box-shadow:inset 0 0 0 1px var(--rule-soft)}
  .side .dot{margin-left:4px}
  .main{padding-top:28px}
  .main h2{font-size:27px}
  .btn{width:100%}
  .nav{flex-direction:column-reverse}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app" hidden>

    <div class="logo">

<script>
/* ── Supabase 연결 정보 ────────────────────────────── */
var SUPABASE_URL = "https://qtiazentdzwzkgrsjbob.supabase.co";
var SUPABASE_KEY = "sb_publishable_bKsdXn04F_MCXT9YgCiYZg_biJjPRZC";

/* 질문은 questions.js 에 있습니다.
   고객 명단은 이제 데이터베이스에 있고, 관리자 화면에서 추가합니다. */

/* ═══════════════ 여기부터는 동작 코드 ═══════════════ */
(function(){
  var KEY = (function(){
    var m = /[?&]k=([^&#]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  })();

  var sb = null, brief = null, STEPS = [];
  var answers = {}, cur = 0, saveTimer = null, submitted = false;
  var $ = function(id){ return document.getElementById(id); };

  function gate(title, desc){
    $("gate").hidden = false;
    $("app").hidden = true;
    $("gate-h").innerHTML = title;
    $("gate-d").textContent = desc;
  }

  function buildSteps(use){
    STEPS = [];
    MODULES.forEach(function(m){
      if(m.id === "closing" || use.indexOf(m.id) < 0) return;
      m.steps.forEach(function(st){ st._mod = m.name; st._modId = m.id; STEPS.push(st); });
    });
    MODULES.forEach(function(m){
      if(m.id !== "closing") return;
      m.steps.forEach(function(st){ st._mod = m.name; st._modId = m.id; STEPS.push(st); });
    });
  }

  /* ── 시작 ── */
  function boot(){
    if(!window.supabase || !window.supabase.createClient){
      return gate("연결 실패", "필요한 파일을 불러오지 못했습니다. 새로고침해 주세요.");
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    if(!KEY){
      return gate("링크가 <b>올바르지 않습니다</b>",
        "ASOG에서 보내드린 주소를 그대로 열어주세요. 주소 뒤쪽이 잘렸을 수 있습니다.");
    }
    sb.rpc("brief_load", { p_key: KEY }).then(function(r){
      if(r.error || !r.data){
        return gate("링크가 <b>올바르지 않습니다</b>",
          "만료되었거나 잘못된 주소입니다. 010-2835-5878로 연락 주세요.");
      }
      brief = r.data;
      answers = brief.answers || {};
      submitted = !!brief.submitted_at;
      buildSteps(brief.modules || ["common"]);
      $("gate").hidden = true;
      $("app").hidden = false;
      $("who").textContent = brief.company;
      setSave("saved");
      cur = 0;
      render();
    });
  }
  function loadScript(src, ok, bad){
    var t = document.createElement("script");
    t.src = src; t.onload = ok; t.onerror = bad;
    document.head.appendChild(t);
  }
  loadScript("supabase.js", boot, function(){
    loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js",
      boot, function(){ gate("연결 실패", "필요한 파일을 불러오지 못했습니다. 새로고침해 주세요."); });
  });

  /* ── 저장 ── */
  function queueSave(){
    setSave("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 900);
  }
  function save(){
    sb.rpc("brief_save", { p_key: KEY, p_answers: answers }).then(function(r){
      setSave(r.error || r.data === false ? "err" : "saved");
    });
  }
  function setSave(state){
    var el = $("save-state");
    el.className = "save-state " + (state === "err" ? "" : state);
    el.textContent = state === "saving" ? "저장 중" :
                     state === "saved"  ? "저장됨" : "저장 실패 — 다시 시도합니다";
    if(state === "err"){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 4000); }
  }

  /* ── 그리기 ── */
  function render(){
    var s = STEPS[cur];
    $("step-h").textContent = s._mod + "  ·  " + s.title + "  ·  " + (cur + 1) + " / " + STEPS.length;
    $("step-t").innerHTML = s.head;
    $("step-i").textContent = s.intro;
    $("step-w").innerHTML = s.warn ? '<p class="warn"><b>주의</b>' + s.warn + '</p>' : "";
    $("step-r").innerHTML = s.ref || "";
    $("qs").innerHTML = s.qs.map(qHtml).join("");
    bindInputs();
    renderSide();
    renderDone();
    $("prev").style.visibility = cur === 0 ? "hidden" : "visible";
    $("next").textContent = cur === STEPS.length - 1 ? "다 적었습니다" : "다음 →";
    updateBar();
    window.scrollTo(0, 0);
  }

  function updateBar(){
    var filled = STEPS.reduce(function(a, st){ return a + (stepDone(st) ? 1 : 0); }, 0);
    $("bar").style.width = Math.round(filled / STEPS.length * 100) + "%";
  }

  function qHtml(q){
    var v = answers[q.id];
    var head = '<span class="lab">' + q.label +
      (q.req ? '<span class="req">필수</span>' : '') + '</span>' +
      (q.easy ? '<p class="easy"><b>쉽게 설명</b>' + q.easy + '</p>' : '') +
      (q.help ? '<p class="help">' + q.help + '</p>' : '');
    var tail = q.ex ? '<p class="ex"><b>예시 답변</b>' + q.ex + '</p>' : '';
    var body;
    if(q.type === "long"){
      body = '<textarea data-q="' + q.id + '" placeholder="' + (q.ph || "") + '">' + esc(v || "") + '</textarea>';
    } else if(q.type === "one" || q.type === "many"){
      var many = q.type === "many";
      var set = many ? (v || []) : v;
      body = '<div class="opts">' + q.opts.map(function(o){
        var on = many ? set.indexOf(o) > -1 : set === o;
        return '<label class="opt' + (on ? ' on' : '') + '">' +
          '<input type="' + (many ? "checkbox" : "radio") + '" name="' + q.id + '" value="' + esc(o) + '"' +
          ' data-q="' + q.id + '" data-many="' + many + '"' + (on ? " checked" : "") + '>' + o + '</label>';
      }).join("") + '</div>';
    } else {
      body = '<input type="' + q.type + '" data-q="' + q.id + '" value="' + esc(v || "") +
             '" placeholder="' + (q.ph || "") + '">';
    }
    return '<div class="q">' + head + body + tail + '</div>';
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function bindInputs(){
    var box = $("qs");
    box.querySelectorAll("input[type=text],input[type=tel],input[type=email],input[type=url],textarea")
      .forEach(function(el){
        el.addEventListener("input", function(){
          answers[el.dataset.q] = el.value;
          queueSave();
          renderSide();
          updateBar();
        });
      });
    box.querySelectorAll("input[type=radio],input[type=checkbox]").forEach(function(el){
      el.addEventListener("change", function(){
        var q = el.dataset.q;
        if(el.dataset.many === "true"){
          var picked = [];
          box.querySelectorAll('input[data-q="' + q + '"]:checked').forEach(function(c){ picked.push(c.value); });
          answers[q] = picked;
        } else {
          answers[q] = el.value;
        }
        box.querySelectorAll('input[data-q="' + q + '"]').forEach(function(c){
          c.closest(".opt").classList.toggle("on", c.checked);
        });
        queueSave();
        renderSide();
        updateBar();
      });
    });
  }

  function stepDone(s){
    return s.qs.some(function(q){
      var v = answers[q.id];
      return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
    });
  }

  function renderSide(){
    var last = null;
    $("side").innerHTML = STEPS.map(function(s, i){
      var head = "";
      if(s._mod !== last){ head = '<li class="grp">' + s._mod + '</li>'; last = s._mod; }
      return head + '<li><button data-i="' + i + '"' +
        (i === cur ? ' aria-current="true"' : '') +
        (stepDone(s) ? ' class="done"' : '') + '>' +
        '<span class="n">' + s.n + '</span>' + s.title + '<span class="dot"></span></button></li>';
    }).join("");
    $("side").querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){ cur = +b.dataset.i; render(); });
    });
  }

  function renderDone(){
    if(cur !== STEPS.length - 1){ $("done-slot").innerHTML = ""; return; }
    var missing = [];
    STEPS.forEach(function(s){
      s.qs.forEach(function(q){
        if(q.req){
          var v = answers[q.id];
          if(!(Array.isArray(v) ? v.length : (v && String(v).trim()))){ missing.push(s.title + " — " + q.label); }
        }
      });
    });
    $("done-slot").innerHTML = '<div class="done-card">' +
      '<h3>' + (missing.length ? "아직 비어 있는 필수 항목이 있습니다" : "여기까지 하시면 충분합니다") + '</h3>' +
      (missing.length
        ? '<p>아래 항목만 채워주시면 됩니다.</p><p>· ' + missing.join('<br>· ') + '</p>'
        : '<p>작성하신 내용은 이미 저장되어 있습니다. 창을 닫으셔도 되고, 나중에 다시 들어오셔서 고치셔도 됩니다.</p>' +
          '<p>다 적으셨다면 아래 버튼을 눌러주세요. 저희가 확인하고 하루 안에 연락드립니다. 누르신 뒤에도 수정은 계속 가능합니다.</p>' +
          '<p style="margin-top:22px"><b>다 적으신 뒤 저희가 함께 확인할 것</b></p>' +
          '<ul class="closing"><li>' + CLOSING.join('</li><li>') + '</li></ul>' +
          '<p style="margin-top:20px"><button class="btn sm" id="submit-btn">작성 완료 알리기</button></p>') +
      '</div>';
    var sbtn = $("submit-btn");
    if(sbtn){
      if(submitted){ sbtn.textContent = "알림 보냄 ✓"; sbtn.disabled = true; }
      sbtn.addEventListener("click", function(){
        submitted = true;
        sbtn.textContent = "알림 보냄 ✓";
        sbtn.disabled = true;
        sb.rpc("brief_submit", { p_key: KEY }).then(function(){});
      });
    }
  }

  $("prev").addEventListener("click", function(){ if(cur > 0){ cur--; render(); } });
  $("next").addEventListener("click", function(){ if(cur < STEPS.length - 1){ cur++; render(); } });

})();
</script>
</body>
</html>
