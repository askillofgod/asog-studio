<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ASOG 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#0C2141; --brand:#0040C8; --bright:#246BFE; --pale:#EAF1FF;
  --ground:#FFFFFF; --panel:#F7F8FA; --ink:#0C2141; --ink-2:#5A6478;
  --rule:#D5DCE8; --rule-soft:#E8ECF3; --ok:#0E8A5F; --error:#C8102E;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Pretendard,"Pretendard Variable",Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,li,label{margin:0}
ul{padding:0;list-style:none}
button,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bright);outline-offset:3px;border-radius:3px}
[hidden]{display:none!important}

.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-in{width:100%;max-width:440px}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:40px}
.logo svg{width:30px;height:auto;color:var(--brand);display:block}
.logo span{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--ink-2)}
.gate h1{font-size:32px;font-weight:300;line-height:1.25;letter-spacing:-.04em;margin-bottom:12px}
.gate h1 b{font-weight:700}
.gate .desc{color:var(--ink-2);font-size:16px;margin-bottom:28px}
label.f{display:block;font-size:15px;font-weight:600;margin-bottom:8px}
input[type=email],input[type=password]{width:100%;background:var(--ground);border:1.5px solid var(--rule);
  border-radius:4px;padding:0 16px;height:54px}
input[type=password]{font-family:var(--mono);letter-spacing:.06em}
.gate-keep{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:15px;color:var(--ink-2)}
.gate-keep input{width:17px;height:17px;accent-color:var(--brand);margin:0}
.gate-err{margin-top:14px;font-size:15px;color:var(--error)}
.gate-hint{margin-top:22px;font-size:14px;line-height:1.6;color:var(--ink-2)}
input:focus{border-color:var(--brand);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 26px;
  border:0;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;
  background:var(--brand);color:#fff;width:100%;margin-top:14px}
.btn:hover{background:#0037AC}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{height:42px;padding:0 16px;font-size:15px;width:auto;margin:0}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.ghost:hover{background:var(--panel)}
.msg{margin-top:16px;padding:15px 17px;border-radius:4px;font-size:15px;line-height:1.6}
.msg.ok{background:var(--pale);color:var(--navy)}
.msg.err{background:#FDECEF;color:var(--error)}

.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule);
  padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .logo{margin:0}
.top .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--bright);font-size:15px;cursor:pointer;padding:4px}

.shell{max-width:1240px;margin:0 auto;padding:0 22px;
  display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}
.side{position:sticky;top:92px;padding:28px 0;min-width:0}
.side h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:12px}
.cli{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:14px;
  border-radius:5px;box-shadow:inset 0 0 0 1px var(--rule-soft);margin-bottom:8px;line-height:1.45}
.cli:hover{background:var(--panel)}
.cli[aria-current="true"]{background:var(--pale);box-shadow:inset 0 0 0 1.5px var(--brand)}
.cli .co{font-size:17px;font-weight:700;letter-spacing:-.01em}
.cli .em{font-size:14px;color:var(--ink-2);margin-top:2px;word-break:break-all}
.cli .stg{font-size:13px;font-weight:600;color:var(--brand);white-space:nowrap}
.cli .st{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;color:var(--ink-2);
  font-family:var(--mono)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;
  font-family:var(--sans)}
.pill.done{background:#DCF3E9;color:var(--ok)}
.pill.ing{background:#FFF3CD;color:#6B4E00}
.mini{height:4px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin-top:9px}
.mini i{display:block;height:100%;background:var(--brand)}

.main{padding:28px 0 90px;min-width:0}
.hd{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding-bottom:20px;border-bottom:1px solid var(--rule)}
.hd h1{font-size:30px;font-weight:300;letter-spacing:-.04em;line-height:1.2}
.hd h1 b{font-weight:700}
.hd .meta{font-size:14px;color:var(--ink-2);font-family:var(--mono);margin-top:8px}
.hd .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grp{margin-top:40px}
.grp > h3{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brand);padding-bottom:8px;border-bottom:1.5px solid var(--brand)}
.stp{margin-top:26px}
.stp > h4{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.row{padding:16px 0;border-bottom:1px solid var(--rule-soft)}
.row .q{font-size:16px;font-weight:600;color:var(--ink);line-height:1.55}
.row .a{margin-top:7px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.row.empty .q{color:var(--ink-2);font-weight:500}
.row.empty .a{color:#9AA4B8;font-style:normal}
.empty-note{color:#9AA4B8}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--brand)}
.blank{padding:60px 0;color:var(--ink-2);font-size:17px}
/* ── 프로젝트 정보 ── */
.pj{margin-top:26px;padding:22px 24px;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.pj-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.pj-top h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500}
.pj-top .linkbtn{margin-left:auto}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 24px}
.pj-grid dt{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.pj-grid dd{font-size:17px;line-height:1.45;margin:0}
.pj-grid dd .none{color:#9AA4B8}
.pj-dday{margin-left:8px;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;
  background:var(--pale);color:var(--brand);white-space:nowrap}
.pj-dday.warn{background:#FFF3CD;color:#6B4E00}
.pj-dday.over{background:#FDE7EB;color:var(--error)}
.pj-memo{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:16px;line-height:1.7;white-space:pre-wrap;color:var(--ink-2)}
.pj-links{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:8px}
.pj-links a{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;
  border:1.5px solid var(--rule);background:var(--ground);font-size:15px;font-weight:600;
  text-decoration:none;color:var(--brand)}
.pj-links a:hover{border-color:var(--brand);background:var(--pale)}
.pj-links a.key{background:var(--brand);border-color:var(--brand);color:#fff}
.pj-links a.key:hover{background:#0037AC;border-color:#0037AC}
.pj-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px 20px}
.pj-form label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px}
.pj-form input,.pj-form select,.pj-form textarea{width:100%;background:var(--ground);
  border:1.5px solid var(--rule);border-radius:4px;padding:0 12px;height:46px;font-size:16px}
.pj-form textarea{height:92px;padding:11px 12px;line-height:1.6;resize:vertical}
.pj-form input:focus,.pj-form select:focus,.pj-form textarea:focus{border-color:var(--brand);outline:none}
.pj-wide{grid-column:1/-1}
.pj-lk{display:flex;gap:8px;margin-bottom:8px}
.pj-lk .lk-label{max-width:170px}
.pj-lk .lk-mv,.pj-lk .lk-del{flex:none;width:42px;height:46px;border:1.5px solid var(--rule);
  border-radius:4px;background:var(--ground);color:var(--ink-2);font-size:17px;line-height:1;
  cursor:pointer;padding:0}
.pj-lk .lk-mv:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pj-lk .lk-mv:disabled{opacity:.3;cursor:default}
.pj-lk .lk-del{font-size:20px}
.pj-lk .lk-del:hover{border-color:var(--error);color:var(--error)}
.pj-save{display:flex;align-items:center;gap:8px;margin-top:20px}
.pj-err{margin-left:6px;font-size:15px;color:var(--error)}
.pj-next{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:16px 18px;
  border-radius:6px;background:var(--pale);margin-bottom:22px}
.pj-next.late{background:#FDE7EB}
.pj-next-k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.pj-next.late .pj-next-k{color:var(--error)}
.pj-next-v{font-size:18px;font-weight:600;line-height:1.4}
.pj-next-d{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.pj-stage{margin-left:auto;font-size:14px;font-weight:700;color:var(--brand);
  background:var(--ground);border-radius:999px;padding:5px 14px;white-space:nowrap}
.pj-sec{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.pj-sec:first-of-type{margin-top:0;padding-top:0;border-top:0}
.pj-sec > h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin-bottom:12px}
.pj-grid dd a{color:var(--brand);text-decoration:none;font-weight:600}
.pj-grid dd a:hover{text-decoration:underline}
.pj-fh{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:22px 0 12px}
.pj-fh:first-of-type{margin-top:0}
.pj-warn{margin-top:12px;font-size:14px;line-height:1.6;color:#6B4E00;
  background:#FFF3CD;border-radius:4px;padding:10px 14px}

.addbox{padding:20px;border-radius:6px;background:var(--panel);
  box-shadow:inset 0 0 0 1px var(--rule-soft);margin-bottom:16px}
.addbox label.f{margin-top:14px}
.addbox label.f:first-child{margin-top:0}
.addbox input[type=text]{width:100%;background:var(--ground);border:1.5px solid var(--rule);
  border-radius:4px;padding:0 14px;height:48px}
.mods{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.mods label{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:4px;
  border:1.5px solid var(--rule);cursor:pointer;font-size:14px;background:var(--ground)}
.mods label.on{border-color:var(--brand);background:var(--pale);color:var(--brand);font-weight:600}
.mods input{width:15px;height:15px;accent-color:var(--brand);margin:0}
.linkbox{margin-top:14px;padding:14px;border-radius:5px;background:var(--pale);font-size:14px}
.linkbox code{display:block;font-family:var(--mono);font-size:13px;word-break:break-all;
  margin:8px 0;line-height:1.6}
.linkbox p{margin:0;line-height:1.6}

/* ── 바로가기 ── */

/* ── 수정 요청 ── */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;background:none;border:0;cursor:pointer;padding:10px 8px;border-radius:5px;
  font-size:15px;font-weight:600;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule-soft)}
.tabs button[aria-current="true"]{background:var(--pale);color:var(--brand);
  box-shadow:inset 0 0 0 1.5px var(--brand)}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px}
.filters button{background:var(--ground);border:1.5px solid var(--rule);border-radius:99px;
  padding:7px 15px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.filters button[aria-current="true"]{border-color:var(--brand);background:var(--pale);
  color:var(--brand);font-weight:600}
.fb{padding:20px 0;border-bottom:1px solid var(--rule-soft)}
.fb .line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.fb .no{font-family:var(--mono);font-weight:600;color:#fff;border-radius:99px;padding:2px 9px;font-size:13px}
.fb .co{font-weight:700;color:var(--ink);font-size:15px}
.fb .st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor}
.fb .so{font-size:12px;font-weight:700;color:#6B4E00;background:#FFF3CD;border-radius:99px;padding:3px 9px}
.fb .body{margin-top:9px;font-size:17px;line-height:1.65;white-space:pre-wrap}
.fb .where{margin-top:7px;font-family:var(--mono);font-size:13px;color:var(--ink-2);word-break:break-all}
.fb .tools{margin-top:13px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fb .tools .seg{display:flex;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.fb .tools .seg button{background:var(--ground);border:0;padding:8px 13px;font-size:14px;cursor:pointer;
  color:var(--ink-2);border-right:1px solid var(--rule-soft)}
.fb .tools .seg button:last-child{border-right:0}
.fb .tools .seg button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:600}
.fb .tools .txt{background:none;border:0;color:var(--ink-2);font-size:14px;cursor:pointer;
  text-decoration:underline;padding:8px 4px}
.fb .rep{margin-top:11px}
.fb .rep textarea{width:100%;min-height:70px;background:var(--panel);border:1.5px solid var(--rule);
  border-radius:5px;padding:11px 13px;font:inherit;font-size:15px;line-height:1.6;resize:vertical}
.fb .rep textarea:focus{border-color:var(--brand);outline:none;background:var(--ground)}
.fb .rep .save{margin-top:7px}
.fb.done{opacity:.62}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:0}
  .side{position:static;padding:20px 0 0}
  .main{padding-top:22px}
  .hd .acts{margin-left:0;width:100%}
}
@media print{
  .top,.side,.hd .acts,.toggle{display:none!important}
  .shell{display:block;max-width:none;padding:0}
  .row.empty{display:none}
  body{font-size:12pt}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-in">
    <div class="logo">
      <svg viewBox="0 0 206 156.5" aria-label="ASOG"><path fill="currentColor" transform="translate(-100 -191.8516)" d="M 182.105469 192.21875 L 208.84375 192.054688 C 214.707031 192.023438 221.671875 191.851562 227.4375 192.34375 C 229.984375 194.890625 238.457031 212.917969 240.632812 217.242188 L 257.957031 251.289062 L 291.101562 316.398438 C 294.722656 323.558594 304.53125 340.863281 306 347.746094 C 290.953125 347.527344 275.644531 348.308594 260.5625 347.859375 C 258.621094 347.800781 256.699219 347.652344 254.765625 347.464844 C 253.019531 344.929688 249.984375 338.578125 248.535156 335.554688 C 245.238281 328.679688 242.238281 322.019531 238.660156 315.25 C 234.820312 315.757812 231.878906 316.945312 228.308594 318.378906 C 223.046875 320.789062 218.21875 321.585938 212.984375 323.558594 L 167.554688 340.570312 C 163.425781 342.089844 151.210938 347.234375 147.476562 347.457031 C 132.484375 348.347656 115.015625 347.667969 100 347.804688 C 108.871094 329.621094 118.605469 311.1875 127.679688 293.101562 L 178.039062 192.714844 C 178.925781 192.511719 181.109375 192.328125 182.105469 192.21875 Z M 172.667969 301.621094 C 182.664062 301.445312 192.992188 301.992188 203.046875 301.828125 C 210.34375 301.828125 225.570312 302.132812 232.296875 301.238281 C 226.097656 285.265625 217.566406 270.214844 210.613281 254.539062 C 210.042969 253.253906 203.351562 239.644531 203.089844 239.484375 C 193.257812 256.480469 186.019531 276.074219 176.691406 293.441406 C 175.398438 295.847656 173.710938 299.136719 172.667969 301.621094 Z"/></svg>
      <span>ASOG · 스튜디오</span>
    </div>
    <h1 id="gate-h">불러오는 중</h1>
    <p class="desc" id="gate-d">잠시만 기다려 주세요.</p>

    <!-- 코드를 주소에 붙이지 않고 여기서 입력한다. 주소창과 방문기록에
         열쇠가 남지 않고, 주소는 즐겨찾기에 그냥 넣어 둘 수 있다. -->
    <form id="gate-form" hidden autocomplete="off">
      <label class="f" for="gate-key">스튜디오 코드</label>
      <input type="password" id="gate-key" name="studio-key" placeholder="a-••••••••••••••••••••"
             autocomplete="current-password" spellcheck="false">
      <label class="gate-keep"><input type="checkbox" id="gate-keep" checked> 이 브라우저에서 기억하기</label>
      <button type="submit" class="btn" id="gate-go">열기</button>
      <p class="gate-err" id="gate-err" hidden></p>
      <p class="gate-hint">이 화면은 어소그 내부용입니다. 고객에게는 알려주지 않습니다.</p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 206 156.5" aria-label="ASOG"><path fill="currentColor" transform="translate(-100 -191.8516)" d="M 182.105469 192.21875 L 208.84375 192.054688 C 214.707031 192.023438 221.671875 191.851562 227.4375 192.34375 C 229.984375 194.890625 238.457031 212.917969 240.632812 217.242188 L 257.957031 251.289062 L 291.101562 316.398438 C 294.722656 323.558594 304.53125 340.863281 306 347.746094 C 290.953125 347.527344 275.644531 348.308594 260.5625 347.859375 C 258.621094 347.800781 256.699219 347.652344 254.765625 347.464844 C 253.019531 344.929688 249.984375 338.578125 248.535156 335.554688 C 245.238281 328.679688 242.238281 322.019531 238.660156 315.25 C 234.820312 315.757812 231.878906 316.945312 228.308594 318.378906 C 223.046875 320.789062 218.21875 321.585938 212.984375 323.558594 L 167.554688 340.570312 C 163.425781 342.089844 151.210938 347.234375 147.476562 347.457031 C 132.484375 348.347656 115.015625 347.667969 100 347.804688 C 108.871094 329.621094 118.605469 311.1875 127.679688 293.101562 L 178.039062 192.714844 C 178.925781 192.511719 181.109375 192.328125 182.105469 192.21875 Z M 172.667969 301.621094 C 182.664062 301.445312 192.992188 301.992188 203.046875 301.828125 C 210.34375 301.828125 225.570312 302.132812 232.296875 301.238281 C 226.097656 285.265625 217.566406 270.214844 210.613281 254.539062 C 210.042969 253.253906 203.351562 239.644531 203.089844 239.484375 C 193.257812 256.480469 186.019531 276.074219 176.691406 293.441406 C 175.398438 295.847656 173.710938 299.136719 172.667969 301.621094 Z"/></svg>
      <span>ASOG · 스튜디오</span>
    </div>
    <span class="sp"></span>
    <button class="linkbtn" id="reload">새로고침</button>
    <button class="linkbtn" id="lock">잠그기</button>
  </header>

  <div class="shell">
    <nav class="side">
      <div class="tabs">
        <button id="tab-a" aria-current="true">고객 답변</button>
        <button id="tab-f">수정 요청</button>
      </div>
      <h2 id="cnt">고객</h2>
      <button class="btn sm" id="add" style="width:100%;margin-bottom:14px">+ 고객 추가</button>
      <div id="list"></div>
    </nav>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- 고객 질문지와 같은 사이트 안에 있으므로 바로 위 폴더의 원본을 그대로 쓴다.
     사본을 만들지 않으니 질문을 고칠 때 한 군데만 고치면 된다. -->
<script src="../questions.js"></script>
<script src="../supabase.js" onerror="window.__sbFail=1"></script>
<script>
var SUPABASE_URL = "https://qtiazentdzwzkgrsjbob.supabase.co";
var SUPABASE_KEY = "sb_publishable_bKsdXn04F_MCXT9YgCiYZg_biJjPRZC";

/* ══════════════════════════════════════════════════════════
   바로가기 — 왼쪽 아래에 버튼으로 나옵니다.
   local: true 로 두면 "내 컴퓨터에서만 열림" 표시가 붙습니다.
   주소를 바꾸거나 줄을 추가·삭제하시면 그대로 반영됩니다.
   ══════════════════════════════════════════════════════════ */
(function(){
  // 코드는 주소(?a=)로도 받고, 한 번 확인되면 이 브라우저에 저장해 둔다.
  // 예전에 쓰던 주소를 눌러도 그대로 열리게 하려고 둘 다 본다.
  var STORE = "asog-studio-key";
  var AKEY = "";
  function savedKey(){
    var m = /[?&]a=([^&#]+)/.exec(location.search);
    if(m) return decodeURIComponent(m[1]);
    try { return localStorage.getItem(STORE) || ""; } catch(e){ return ""; }
  }

  var sb = null, rows = [], pick = null, hideEmpty = true;
  var view = "answers";      // answers | feedback
  var fbRows = [], fbFilter = "open";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function gate(t, d){
    $("gate").hidden = false; $("app").hidden = true;
    $("gate-form").hidden = true;
    $("gate-h").innerHTML = t; $("gate-d").textContent = d;
  }

  /* 코드를 물어보는 화면 */
  function askKey(msg){
    $("gate").hidden = false; $("app").hidden = true;
    $("gate-h").innerHTML = "ASOG <b>스튜디오</b>";
    $("gate-d").textContent = "코드를 입력하면 열립니다.";
    $("gate-form").hidden = false;
    var err = $("gate-err");
    if(msg){ err.textContent = msg; err.hidden = false; } else { err.hidden = true; }
    $("gate-key").value = "";
    $("gate-key").focus();
  }

  /* 코드가 맞는지는 서버가 판단한다. 화면에서 비교하면 코드가 파일 안에 남아
     아무 의미가 없다. onFail 은 "bad"(코드가 틀림) 또는 "net"(연결 실패). */
  function tryKey(key, keep, onFail){
    sb.rpc("admin_ok", { p_key: key }).then(function(r){
      if(r.error) return onFail("net");
      if(r.data !== true) return onFail("bad");
      AKEY = key;
      try {
        if(keep) localStorage.setItem(STORE, key);
        else localStorage.removeItem(STORE);
      } catch(e){}
      // 주소창과 방문기록에 코드를 남기지 않는다
      if(/[?&]a=/.test(location.search) && history.replaceState){
        history.replaceState(null, "", location.pathname);
      }
      $("gate").hidden = true;
      $("app").hidden = false;
      load();
    });
  }

  /* 모든 질문을 한 줄로 펼쳐 둡니다 (모듈 → 단계 → 질문) */
  var ALL = [];
  var MODULES = window.MODULES || [];
  MODULES.forEach(function(m){
    m.steps.forEach(function(st){
      ALL.push({ mod:m.name, modId:m.id, step:st });
    });
  });

  function boot(){
    if(window.__sbFail || !window.supabase || !MODULES.length){
      return gate("연결 실패", "필요한 파일을 불러오지 못했습니다. 새로고침해 주세요.");
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    $("gate-form").addEventListener("submit", function(e){
      e.preventDefault();
      var key = $("gate-key").value.trim();
      if(!key) return;
      var go = $("gate-go");
      go.disabled = true; go.textContent = "확인 중…";
      tryKey(key, $("gate-keep").checked, function(why){
        go.disabled = false; go.textContent = "열기";
        askKey(why === "net" ? "연결에 실패했습니다. 잠시 뒤 다시 시도해 주세요."
                             : "코드가 맞지 않습니다.");
      });
    });

    var have = savedKey();
    if(!have) return askKey("");
    // 저장해 둔 코드가 아직 유효한지 확인하고 들어간다
    tryKey(have, true, function(why){
      if(why === "bad"){
        try { localStorage.removeItem(STORE); } catch(e){}
        return askKey("저장된 코드가 더 이상 맞지 않습니다. 다시 입력해 주세요.");
      }
      askKey("연결에 실패했습니다. 잠시 뒤 다시 시도해 주세요.");
    });
  }

  $("reload").addEventListener("click", function(){ load(); });
  $("lock").addEventListener("click", function(){
    try { localStorage.removeItem(STORE); } catch(e){}
    location.replace(location.pathname);
  });

  function load(){
    $("main").innerHTML = '<p class="blank">불러오는 중…</p>';
    sb.rpc("admin_list", { p_key: AKEY })
      .then(function(r){
        if(r.error){
          $("main").innerHTML = '<p class="blank">불러오지 못했습니다.<br><br>' + esc(r.error.message) + '</p>';
          return;
        }
        rows = r.data || [];
        if(pick){
          var still = rows.filter(function(x){ return x.access_key === pick.access_key; })[0];
          pick = still || null;
        }
        renderList();
        if(view === "answers") renderMain();
        loadFb();
      });
  }

  function loadFb(){
    return sb.rpc("admin_fb", { p_key: AKEY }).then(function(r){
      fbRows = (r && r.data) || [];
      renderTabs();
      renderList();
      if(view === "feedback") renderFb();
    });
  }

  function openCount(){
    return fbRows.filter(function(f){ return f.status !== "done"; }).length;
  }
  function renderTabs(){
    var n = openCount();
    $("tab-f").textContent = n ? "수정 요청 " + n : "수정 요청";
  }

  /* ── 바로가기 ── */
  $("tab-a").addEventListener("click", function(){ setView("answers"); });
  $("tab-f").addEventListener("click", function(){ setView("feedback"); });

  function setView(v){
    view = v;
    $("tab-a").setAttribute("aria-current", v === "answers" ? "true" : "false");
    $("tab-f").setAttribute("aria-current", v === "feedback" ? "true" : "false");
    if(v === "feedback"){
      $("main").innerHTML = '<p class="blank">불러오는 중…</p>';
      loadFb();
    } else {
      renderMain();
    }
    renderList();
  }

  // 고객이 보는 화면은 이 사이트의 루트에 있고, 스튜디오는 /studio/ 안에 있다.
  // 고객에게 나가는 링크(질문지·제안서·pin.js)는 항상 루트를 기준으로 만든다.
  function baseUrl(){
    return location.origin + "/";
  }
  function linkFor(row){
    return baseUrl() + "?k=" + row.access_key;
  }
  function answered(row){
    var a = row.answers || {}, n = 0;
    Object.keys(a).forEach(function(k){
      var v = a[k];
      if(Array.isArray(v) ? v.length : (v != null && String(v).trim())) n++;
    });
    return n;
  }
  function totalFor(row){
    var use = row.modules || ["common"], n = 0;
    ALL.forEach(function(e){
      if(e.modId !== "closing" && use.indexOf(e.modId) < 0) return;
      n += e.step.qs.length;
    });
    return n || 1;
  }
  function when(t){
    if(!t) return "—";
    var d = new Date(t), p = function(x){ return (x<10?"0":"") + x; };
    return d.getFullYear() + "." + p(d.getMonth()+1) + "." + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes());
  }

  /* ── 고객 추가 ── */
  $("add").addEventListener("click", function(){
    view = "answers";
    $("tab-a").setAttribute("aria-current", "true");
    $("tab-f").setAttribute("aria-current", "false");
    renderAdd();
  });

  function renderAdd(){
    pick = null; renderList();
    var mods = MODULES.filter(function(m){ return m.id !== "closing"; });
    $("main").innerHTML =
      '<div class="hd"><div><h1>고객 <b>추가</b></h1>' +
      '<div class="meta">회사명과 물어볼 묶음을 정하면 링크가 만들어집니다</div></div></div>' +
      '<div class="addbox" style="margin-top:26px;max-width:620px">' +
        '<label class="f" for="nc">회사·단체명</label>' +
        '<input type="text" id="nc" placeholder="비전필름">' +
        '<label class="f">물어볼 묶음</label>' +
        '<div class="mods" id="nm">' + mods.map(function(m, i){
          return '<label' + (m.id === "common" ? ' class="on"' : '') + '>' +
            '<input type="checkbox" value="' + m.id + '"' + (m.id === "common" ? ' checked' : '') + '>' +
            esc(m.name) + '</label>';
        }).join("") + '</div>' +
        '<button class="btn" id="mk">링크 만들기</button>' +
        '<div id="mkmsg"></div>' +
      '</div>';

    $("nm").querySelectorAll("input").forEach(function(c){
      c.addEventListener("change", function(){ c.closest("label").classList.toggle("on", c.checked); });
    });
    $("mk").addEventListener("click", function(){
      var co = $("nc").value.trim();
      if(!co){ $("mkmsg").innerHTML = '<div class="msg err">회사명을 적어주세요.</div>'; return; }
      var use = [];
      $("nm").querySelectorAll("input:checked").forEach(function(c){ use.push(c.value); });
      if(!use.length) use = ["common"];
      $("mk").disabled = true; $("mk").textContent = "만드는 중…";
      sb.rpc("admin_add", { p_key: AKEY, p_company: co, p_modules: use }).then(function(r){
        $("mk").disabled = false; $("mk").textContent = "링크 만들기";
        if(r.error || !r.data){
          $("mkmsg").innerHTML = '<div class="msg err">' + esc((r.error && r.error.message) || "추가하지 못했습니다.") + '</div>';
          return;
        }
        var url = baseUrl() + "?k=" + r.data;
        $("mkmsg").innerHTML = '<div class="linkbox"><b>' + esc(co) + ' 링크가 만들어졌습니다.</b>' +
          '<code>' + esc(url) + '</code>' +
          '<button class="btn sm ghost" id="newopen" style="margin-top:6px">고객 입력 페이지 열기 ↗</button>' +
          '<p style="margin-top:10px">이 주소를 고객에게 보내시면 됩니다. 목록에서 언제든 다시 복사하실 수 있습니다.</p></div>';
        $("newopen").addEventListener("click", function(){
          window.open(url, "_blank", "noopener,noreferrer");
        });
        $("nc").value = "";
        load();
      });
    });
  }

  function renderList(){
    $("cnt").textContent = "고객 " + rows.length + "곳";
    if(!rows.length){ $("list").innerHTML = '<p class="blank" style="padding:10px 0;font-size:15px">아직 고객이 없습니다.</p>'; return; }
    $("list").innerHTML = rows.map(function(r, i){
      var a = answered(r), t = totalFor(r), pct = Math.round(a / t * 100);
      var fo = r.fb_key ? fbRows.filter(function(f){
        return f.fb_key === r.fb_key && f.status !== "done"; }).length : 0;
      return '<button class="cli" data-i="' + i + '"' +
        (pick && pick.access_key === r.access_key ? ' aria-current="true"' : '') + '>' +
        '<div class="co">' + esc(r.company) + '</div>' +
        '<div class="st">' +
          (r.submitted_at ? '<span class="pill done">작성 완료</span>' : '<span class="pill ing">작성 중</span>') +
          '<span>' + a + ' / ' + t + '</span></div>' +
        '<div class="mini"><i style="width:' + pct + '%"></i></div>' +
        '<div class="st"><span>수정 ' + when(r.updated_at) + '</span>' +
          (r.stage ? '<span class="stg">' + esc(r.stage) + '</span>' : '') +
          (fo ? '<span class="pill ing">요청 ' + fo + '</span>' : '') + '</div>' +
      '</button>';
    }).join("");
    $("list").querySelectorAll(".cli").forEach(function(b){
      b.addEventListener("click", function(){
        var r = rows[+b.dataset.i];
        if(!pick || pick.access_key !== r.access_key) projEdit = false;
        pick = (view === "feedback" && pick && pick.access_key === r.access_key) ? null : r;
        renderList();
          if(view === "feedback") renderFb(); else renderMain();
      });
    });
  }

  /* ══════════════ 수정 요청 ══════════════ */
  var FST = {
    "new":   { label: "접수",      color: "#0040C8" },
    "doing": { label: "작업 중",   color: "#B07800" },
    "done":  { label: "완료",      color: "#0E8A5F" },
    "hold":  { label: "협의 필요", color: "#7A8395" }
  };
  var FILTERS = [
    { id: "open", label: "진행 중" },
    { id: "new",  label: "접수" },
    { id: "doing",label: "작업 중" },
    { id: "hold", label: "협의 필요" },
    { id: "done", label: "완료" },
    { id: "all",  label: "전체" }
  ];

  // 왼쪽에서 고객을 고르면 그 고객 것만 봅니다
  function fbBase(){
    if(!pick) return fbRows;
    return fbRows.filter(function(f){ return !!pick.fb_key && f.fb_key === pick.fb_key; });
  }
  function fbVisible(){
    return fbBase().filter(function(f){
      if(fbFilter === "all") return true;
      if(fbFilter === "open") return f.status !== "done";
      return f.status === fbFilter;
    });
  }

  function renderFb(){
    var base = fbBase(), list = fbVisible();
    var head =
      '<div class="hd"><div>' +
        '<h1>수정 <b>요청</b></h1>' +
        '<div class="meta">' +
          (pick ? esc(pick.company) + ' · ' : '전체 고객 · ') +
          '진행 중 ' + base.filter(function(x){ return x.status !== "done"; }).length +
          '건 / 전체 ' + base.length + '건' +
          (pick ? ' · 왼쪽에서 같은 고객을 다시 누르면 전체가 보입니다' : '') +
        '</div>' +
      '</div><div class="acts">' +
        '<button class="btn sm ghost" id="fbsetup"' +
          (pick ? '' : ' title="왼쪽에서 고객을 먼저 골라주세요"') +
          '>개발 사이트에 붙이기</button>' +
        '<button class="btn sm ghost" id="fbcopy">글로 복사</button>' +
      '</div></div>' +
      '<div class="filters">' + FILTERS.map(function(f){
        var n = f.id === "all" ? base.length
              : f.id === "open" ? base.filter(function(x){ return x.status !== "done"; }).length
              : base.filter(function(x){ return x.status === f.id; }).length;
        return '<button data-f="' + f.id + '"' + (fbFilter === f.id ? ' aria-current="true"' : '') + '>' +
               f.label + ' ' + n + '</button>';
      }).join("") + '</div>' +
      '<div id="fbsetupbox"></div>';

    var body = list.length ? list.map(fbCard).join("") :
      '<p class="blank">해당하는 수정 요청이 없습니다.<br><br>' +
      '개발 중인 사이트에 스크립트 한 줄을 넣으면 고객이 화면을 클릭해 요청을 남길 수 있습니다. ' +
      '왼쪽에서 고객을 고른 뒤 <b>수정 요청 링크 만들기</b>를 눌러보세요.</p>';

    $("main").innerHTML = head + body;

    $("main").querySelectorAll(".filters button").forEach(function(b){
      b.addEventListener("click", function(){ fbFilter = b.dataset.f; renderFb(); });
    });
    $("fbsetup").disabled = !pick;
    if(pick) $("fbsetup").addEventListener("click", function(){ renderFbSetup(); });
    $("fbcopy").addEventListener("click", function(){ copyText(fbAsText(list), $("fbcopy"), "글로 복사"); });
    bindFbCards();
  }

  function fbCard(f){
    var st = FST[f.status] || FST["new"];
    return '<div class="fb' + (f.status === "done" ? " done" : "") + '" data-id="' + f.id + '">' +
      '<div class="line">' +
        '<span class="no" style="background:' + st.color + '">#' + f.num + '</span>' +
        '<span class="co">' + esc(f.company) + '</span>' +
        '<span class="st" style="color:' + st.color + '">' + st.label + '</span>' +
        (f.scope_out ? '<span class="so">별도 협의</span>' : '') +
        '<span>' + (f.author ? esc(f.author) + ' · ' : '') + when(f.created_at) + '</span>' +
      '</div>' +
      '<div class="body">' + esc(f.body) + '</div>' +
      '<div class="where">' + esc(f.path) +
        ' · ' + (f.device === "mobile" ? "모바일" : "PC") + ' ' + (f.vw || "?") + 'px' +
        (f.selector ? ' · ' + esc(f.selector) : '') + '</div>' +
      '<div class="tools">' +
        '<div class="seg">' + ["new","doing","done","hold"].map(function(s){
          return '<button data-st="' + s + '"' + (f.status === s ? ' aria-current="true"' : '') + '>' +
                 FST[s].label + '</button>';
        }).join("") + '</div>' +
        '<button class="txt" data-act="scope">' +
          (f.scope_out ? '별도 협의 해제' : '별도 협의로 표시') + '</button>' +
        (f.url ? '<button class="txt" data-act="open">화면 열기 ↗</button>' : '') +
        '<button class="txt" data-act="del">지우기</button>' +
      '</div>' +
      '<div class="rep">' +
        '<textarea data-rep placeholder="고객에게 보일 답변 (비워두면 표시되지 않습니다)">' +
          esc(f.reply || "") + '</textarea>' +
        '<button class="btn sm ghost save" data-act="reply">답변 저장</button>' +
      '</div>' +
    '</div>';
  }

  function bindFbCards(){
    $("main").querySelectorAll(".fb").forEach(function(el){
      var id = Number(el.dataset.id);
      var f = fbRows.filter(function(x){ return x.id === id; })[0];
      if(!f) return;

      el.querySelectorAll(".seg button").forEach(function(b){
        b.addEventListener("click", function(){
          fbSet(id, { p_status: b.dataset.st, p_reply: null, p_scope_out: null });
        });
      });
      el.querySelectorAll("[data-act]").forEach(function(b){
        b.addEventListener("click", function(){
          var act = b.dataset.act;
          if(act === "scope") return fbSet(id, { p_status: null, p_reply: null, p_scope_out: !f.scope_out });
          if(act === "open")  return window.open(f.url, "_blank", "noopener,noreferrer");
          if(act === "reply"){
            var t = el.querySelector("[data-rep]").value;
            b.textContent = "저장 중…";
            return fbSet(id, { p_status: null, p_reply: t, p_scope_out: null });
          }
          if(act === "del"){
            if(!confirm(f.company + " #" + f.num + " 요청을 지울까요? 되돌릴 수 없습니다.")) return;
            sb.rpc("admin_fb_del", { p_key: AKEY, p_id: id }).then(function(){ loadFb(); });
          }
        });
      });
    });
  }

  function fbSet(id, args){
    args.p_key = AKEY; args.p_id = id;
    sb.rpc("admin_fb_set", args).then(function(){ loadFb(); });
  }

  /* 개발 사이트에 붙일 스크립트 한 줄 */
  function renderFbSetup(){
    var r = pick;
    var box = $("fbsetupbox");
    box.innerHTML = '<div class="linkbox">준비 중…</div>';

    var go = function(fbKey, site){
      var tag = '<script src="' + baseUrl() + 'pin.js" data-key="' + fbKey + '"><\/script>';
      box.innerHTML = '<div class="linkbox">' +
        '<b>' + esc(r.company) + ' — 개발 사이트에 아래 한 줄을 넣어주세요.</b>' +
        '<code id="pintag">' + esc(tag) + '</code>' +
        '<button class="btn sm ghost" id="pincopy">스크립트 복사</button>' +
        '<p style="margin-top:10px">' +
          '개발 중인 사이트의 <b>&lt;/body&gt; 바로 앞</b>에 넣으면 됩니다. ' +
          '고객은 화면 오른쪽 아래 <b>수정 요청</b> 버튼을 눌러 고칠 곳을 클릭하면 되고, 로그인은 필요 없습니다.<br>' +
          '오픈할 때 이 한 줄만 지우면 흔적이 남지 않습니다.' +
        '</p></div>';
      $("pincopy").addEventListener("click", function(){
        copyText(tag, $("pincopy"), "스크립트 복사");
      });
    };

    if(r.fb_key) return go(r.fb_key, r.fb_site);

    sb.rpc("admin_fb_enable", { p_key: AKEY, p_access_key: r.access_key, p_site: null })
      .then(function(res){
        if(res.error || !res.data){
          box.innerHTML = '<div class="msg err">링크를 만들지 못했습니다.</div>';
          return;
        }
        r.fb_key = res.data.fb_key;
        go(res.data.fb_key, res.data.fb_site);
      });
  }

  function fbAsText(list){
    var out = ["수정 요청 목록", when(new Date().toISOString()), ""];
    list.forEach(function(f){
      var st = FST[f.status] || FST["new"];
      out.push("#" + f.num + " [" + st.label + "]" + (f.scope_out ? " [별도 협의]" : "") +
               " · " + f.company + " · " + f.path);
      out.push(f.body);
      if(f.reply) out.push("→ 답변: " + f.reply);
      out.push("");
    });
    return out.join("\n");
  }

  /* ══════════════ 프로젝트 정보 ══════════════
     고객이 쓰는 답변과 달리, 어소그가 직접 적어 두는 값들. */

  var STAGES = ["미팅준비중","미팅준비완료","질문지","기획","시안","개발","검수","오픈","유지보수","보류"];
  var projEdit = false;

  // esc 는 따옴표를 건드리지 않는다. 속성값에 넣을 때는 이걸 쓴다.
  function att(v){ return esc(v).replace(/"/g, "&quot;"); }

  // 링크는 제이든이 직접 넣지만, 붙여넣기 사고로 javascript: 가 들어오면
  // 클릭 한 번에 이 화면의 권한으로 코드가 돈다. http(s) 만 통과시킨다.
  function safeUrl(u){
    u = String(u == null ? "" : u).trim();
    return /^https?:\/\//i.test(u) ? u : "";
  }

  function ymd(v){ return v ? String(v).slice(0, 10) : ""; }
  function dot(v){ return v ? ymd(v).replace(/-/g, ".") : ""; }

  function dday(v){
    if(!v) return "";
    var t = new Date(ymd(v) + "T00:00:00");
    if(isNaN(t)) return "";
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var n = Math.round((t - now) / 86400000);
    if(n < 0)  return '<span class="pj-dday over">' + (-n) + '일 지남</span>';
    if(n === 0) return '<span class="pj-dday over">오늘</span>';
    return '<span class="pj-dday' + (n <= 30 ? ' warn' : '') + '">D-' + n + '</span>';
  }

  function won(v){
    if(v == null || v === "") return "";
    var n = Number(v);
    return isFinite(n) ? n.toLocaleString("ko-KR") + "원" : String(v);
  }

  function overdue(v){
    if(!v) return false;
    var t = new Date(ymd(v) + "T00:00:00");
    var now = new Date(); now.setHours(0, 0, 0, 0);
    return !isNaN(t) && t < now;
  }

  /* 채워진 것만 보여 준다. 항목이 많아져서, 빈 칸까지 다 그리면
     "—" 열네 개가 화면을 채운다. 무엇이 비었는지는 고치기에서 본다. */
  function pjGroup(title, cells){
    var kept = cells.filter(function(c){ return c; });
    if(!kept.length) return "";
    return '<div class="pj-sec"><h3>' + esc(title) + '</h3>' +
      '<dl class="pj-grid">' + kept.join("") + '</dl></div>';
  }
  function pjOne(label, val, extra){
    if(!val) return "";
    return '<div><dt>' + esc(label) + '</dt><dd>' + esc(val) + (extra || "") + '</dd></div>';
  }
  function pjLink(label, url){
    var u = safeUrl(url);
    if(!url) return "";
    if(!u) return pjOne(label, url);
    return '<div><dt>' + esc(label) + '</dt><dd><a href="' + att(u) +
      '" target="_blank" rel="noopener noreferrer">' + esc(url.replace(/^https?:\/\//, "")) + ' ↗</a></dd></div>';
  }

  function projView(r){
    var links = Array.isArray(r.links) ? r.links : [];
    var h = '<section class="pj"><div class="pj-top"><h2>프로젝트 정보</h2>' +
      '<button class="linkbtn" id="pjedit">고치기</button></div>';

    // 지금 무엇을 기다리는가 — 이 칸이 이 화면의 핵심이라 맨 위에 크게 둔다.
    h += '<div class="pj-next' + (r.next_at && overdue(r.next_at) ? ' late' : '') + '">' +
      '<span class="pj-next-k">다음 할 일</span>' +
      '<span class="pj-next-v">' + (r.next_action ? esc(r.next_action)
        : '<span class="none">정하지 않음</span>') + '</span>' +
      (r.next_at ? '<span class="pj-next-d">' + dot(r.next_at) + dday(r.next_at) + '</span>' : '') +
      '<span class="pj-stage">' + (r.stage ? esc(r.stage) : '단계 미정') + '</span></div>';

    h += pjGroup("연락", [
      pjOne("담당자", r.manager),
      pjOne("연락처", r.contact),
      pjOne("이메일", r.email),
      pjOne("사업장 주소", r.address)
    ]);
    h += pjGroup("계약", [
      pjOne("계약일", dot(r.contract_at)),
      pjOne("만료일", dot(r.expires_at), dday(r.expires_at)),
      pjOne("금액", won(r.amount))
    ]);
    h += pjGroup("사이트", [
      pjLink("기존 사이트", r.old_site),
      pjOne("도메인", r.domain),
      pjOne("도메인 만료", dot(r.domain_expires_at), dday(r.domain_expires_at)),
      pjOne("등록처", r.registrar),
      pjOne("호스팅", r.hosting),
      pjOne("오픈일", dot(r.launched_at))
    ]);

    if(r.memo) h += '<div class="pj-memo">' + esc(r.memo) + '</div>';

    // 시안과 제안서는 자리를 정해 두고 늘 맨 앞에 온다.
    // 그 뒤는 프로젝트마다 다른 자료들.
    var chips = [];
    if(safeUrl(r.demo_url))     chips.push({ label: "시안 보기",  url: safeUrl(r.demo_url),     key: true });
    if(safeUrl(r.proposal_url)) chips.push({ label: "제안서",     url: safeUrl(r.proposal_url), key: true });
    links.forEach(function(l){
      var u = safeUrl(l && l.url);
      if(u) chips.push({ label: l.label || u, url: u });
    });
    if(chips.length){
      h += '<div class="pj-links">' + chips.map(function(c){
        return '<a class="' + (c.key ? 'key' : '') + '" href="' + att(c.url) +
          '" target="_blank" rel="noopener noreferrer">' + esc(c.label) + ' ↗</a>';
      }).join("") + '</div>';
    }
    return h + '</section>';
  }

  function pjLinkRow(l){
    l = l || {};
    return '<div class="pj-lk">' +
      '<input class="lk-label" placeholder="이름" value="' + att(l.label || "") + '">' +
      '<input class="lk-url" placeholder="https://" value="' + att(l.url || "") + '">' +
      '<button type="button" class="lk-mv lk-up" title="위로">↑</button>' +
      '<button type="button" class="lk-mv lk-dn" title="아래로">↓</button>' +
      '<button type="button" class="lk-del" title="이 줄 지우기">×</button></div>';
  }

  function pjIn(id, label, val, type, ph, wide){
    return '<div' + (wide ? ' class="pj-wide"' : '') + '><label for="pf-' + id + '">' + esc(label) + '</label>' +
      '<input id="pf-' + id + '"' + (type ? ' type="' + type + '"' : '') +
      (ph ? ' placeholder="' + att(ph) + '"' : '') +
      ' value="' + att(val == null ? "" : String(val)) + '"></div>';
  }

  function projForm(r){
    var links = (Array.isArray(r.links) ? r.links : []).slice();
    if(!links.length) links = [{}];
    var opts = '<option value="">—</option>' + STAGES.map(function(x){
      return '<option value="' + att(x) + '"' + (r.stage === x ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join("");

    return '<section class="pj"><div class="pj-top"><h2>프로젝트 정보 고치기</h2></div>' +

      '<h3 class="pj-fh">지금</h3><div class="pj-form">' +
        '<div><label for="pf-stage">진행 단계</label><select id="pf-stage">' + opts + '</select></div>' +
        pjIn("next_action", "다음 할 일", r.next_action, "", "예: 시안 피드백 대기") +
        pjIn("next_at", "언제까지", ymd(r.next_at), "date") +
      '</div>' +

      '<h3 class="pj-fh">연락</h3><div class="pj-form">' +
        pjIn("company", "회사·단체명", r.company) +
        pjIn("manager", "담당자", r.manager) +
        pjIn("contact", "연락처", r.contact) +
        pjIn("email", "이메일", r.email, "email") +
        pjIn("address", "사업장 주소", r.address, "", "", true) +
      '</div>' +

      '<h3 class="pj-fh">계약</h3><div class="pj-form">' +
        pjIn("contract_at", "계약일", ymd(r.contract_at), "date") +
        pjIn("expires_at", "만료일 · 계약(유지보수)", ymd(r.expires_at), "date") +
        pjIn("amount", "금액 (원)", r.amount == null ? "" : String(r.amount)) +
      '</div>' +

      '<h3 class="pj-fh">사이트</h3><div class="pj-form">' +
        pjIn("old_site", "기존 사이트", r.old_site, "", "https://") +
        pjIn("domain", "도메인", r.domain, "", "example.co.kr") +
        pjIn("domain_expires_at", "도메인 만료일", ymd(r.domain_expires_at), "date") +
        pjIn("registrar", "도메인 등록처", r.registrar, "", "가비아 · 후이즈 …") +
        pjIn("hosting", "호스팅 위치", r.hosting, "", "Cloudflare · 카페24 …") +
        pjIn("launched_at", "오픈일", ymd(r.launched_at), "date") +
      '</div>' +
      '<p class="pj-warn">아이디·비밀번호는 적지 마세요. 스튜디오 코드 하나로 다 열립니다.</p>' +

      '<h3 class="pj-fh">자료와 메모</h3><div class="pj-form">' +
        pjIn("demo_url", "시안 주소", r.demo_url, "", "https://", true) +
        pjIn("proposal_url", "제안서 링크", r.proposal_url, "", "https:// (웹 제안서 또는 PDF)", true) +
        '<div class="pj-wide"><label for="pf-memo">메모</label>' +
          '<textarea id="pf-memo">' + esc(r.memo || "") + '</textarea></div>' +
        '<div class="pj-wide"><label>그 밖의 링크</label>' +
          '<div id="pf-links">' + links.map(pjLinkRow).join("") + '</div>' +
          '<button class="btn sm ghost" type="button" id="pf-add">줄 추가</button></div>' +
      '</div>' +

      '<div class="pj-save"><button class="btn sm" id="pf-save">저장</button>' +
        '<button class="btn sm ghost" id="pf-cancel">취소</button>' +
        '<span class="pj-err" id="pf-err"></span></div></section>';
  }

  function bindProj(r){
    if(!projEdit){
      $("pjedit").addEventListener("click", function(){ projEdit = true; renderMain(); });
      return;
    }
    $("pf-cancel").addEventListener("click", function(){ projEdit = false; renderMain(); });
    $("pf-add").addEventListener("click", function(){
      $("pf-links").insertAdjacentHTML("beforeend", pjLinkRow({}));
      bindLinkRows();
      $("pf-links").lastElementChild.querySelector(".lk-label").focus();
    });
    bindLinkRows();
    $("pf-save").addEventListener("click", function(){ projSave(r); });
  }

  /* 화면에 보이는 줄 순서가 곧 저장되는 순서다. 위·아래로 옮기면
     프로젝트 정보 아래 버튼 순서도 그대로 따라간다. */
  function bindLinkRows(){
    var box = $("pf-links"), rows = [].slice.call(box.children);
    rows.forEach(function(row, i){
      var up = row.querySelector(".lk-up"),
          dn = row.querySelector(".lk-dn"),
          del = row.querySelector(".lk-del");
      up.disabled = (i === 0);
      dn.disabled = (i === rows.length - 1);
      up.onclick = function(){
        if(row.previousElementSibling) box.insertBefore(row, row.previousElementSibling);
        bindLinkRows();
      };
      dn.onclick = function(){
        if(row.nextElementSibling) box.insertBefore(row.nextElementSibling, row);
        bindLinkRows();
      };
      del.onclick = function(){
        if(box.children.length > 1) row.remove();
        else row.querySelectorAll("input").forEach(function(x){ x.value = ""; });
        bindLinkRows();
      };
    });
  }

  function projSave(r){
    var patch = {
      company:           $("pf-company").value,
      stage:             $("pf-stage").value,
      next_action:       $("pf-next_action").value,
      next_at:           $("pf-next_at").value,
      manager:           $("pf-manager").value,
      contact:           $("pf-contact").value,
      email:             $("pf-email").value,
      address:           $("pf-address").value,
      contract_at:       $("pf-contract_at").value,
      expires_at:        $("pf-expires_at").value,
      amount:            $("pf-amount").value.replace(/[^0-9.]/g, ""),
      old_site:          $("pf-old_site").value,
      domain:            $("pf-domain").value,
      domain_expires_at: $("pf-domain_expires_at").value,
      registrar:         $("pf-registrar").value,
      hosting:           $("pf-hosting").value,
      launched_at:       $("pf-launched_at").value,
      demo_url:          $("pf-demo_url").value,
      proposal_url:      $("pf-proposal_url").value,
      memo:              $("pf-memo").value,
      links: [].slice.call($("pf-links").querySelectorAll(".pj-lk")).map(function(row){
        return {
          label: row.querySelector(".lk-label").value.trim(),
          url:   row.querySelector(".lk-url").value.trim()
        };
      }).filter(function(l){ return l.url; })
    };
    var btn = $("pf-save"), err = $("pf-err");
    btn.disabled = true; btn.textContent = "저장 중…"; err.textContent = "";
    sb.rpc("admin_set_project", {
      p_key: AKEY, p_access_key: r.access_key, p_patch: patch
    }).then(function(res){
      if(res.error){
        btn.disabled = false; btn.textContent = "저장";
        err.textContent = "저장하지 못했습니다 — " + res.error.message;
        return;
      }
      var row = (res.data || [])[0];
      if(row){
        rows = rows.map(function(x){ return x.access_key === row.access_key ? row : x; });
        pick = row;
      }
      projEdit = false;
      renderList();
      renderMain();
    });
  }

  function renderMain(){
    if(!pick){
      $("main").innerHTML = '<p class="blank">왼쪽에서 고객을 선택하세요.</p>';
      return;
    }
    var r = pick, a = r.answers || {}, use = r.modules || ["common"];

    var body = "", lastMod = null;
    ALL.forEach(function(e){
      if(e.modId !== "closing" && use.indexOf(e.modId) < 0) return;
      var st = e.step;
      var rowsHtml = st.qs.map(function(q){
        var v = a[q.id];
        var has = Array.isArray(v) ? v.length > 0 : (v != null && String(v).trim() !== "");
        if(!has && hideEmpty) return "";
        var txt = has ? (Array.isArray(v) ? v.join(" · ") : String(v))
                      : '<span class="empty-note">— 비어 있음</span>';
        return '<div class="row' + (has ? '' : ' empty') + '">' +
          '<div class="q">' + esc(q.label) + '</div>' +
          '<div class="a">' + (has ? esc(txt) : txt) + '</div></div>';
      }).join("");
      if(!rowsHtml) return;
      if(e.mod !== lastMod){
        if(lastMod !== null) body += '</div>';
        body += '<div class="grp"><h3>' + esc(e.mod) + '</h3>';
        lastMod = e.mod;
      }
      body += '<div class="stp"><h4>' + esc(st.title) + '</h4>' + rowsHtml + '</div>';
    });
    if(lastMod !== null) body += '</div>';
    if(!body) body = '<p class="blank">아직 작성된 답변이 없습니다.</p>';

    $("main").innerHTML =
      '<div class="hd"><div>' +
        '<h1>' + esc(r.company) + ' <b>답변</b></h1>' +
        '<div class="meta">마지막 수정 ' + when(r.updated_at) +
        (r.submitted_at ? ' · 작성 완료 ' + when(r.submitted_at) : ' · 작성 중') + '</div>' +
      '</div><div class="acts">' +
        '<label class="toggle"><input type="checkbox" id="he"' + (hideEmpty ? ' checked' : '') + '> 빈 항목 숨기기</label>' +
        '<button class="btn sm ghost" id="copen">고객 입력 페이지 열기 ↗</button>' +
        '<button class="btn sm ghost" id="clink">링크 복사</button>' +
        '<button class="btn sm ghost" id="copy">글로 복사</button>' +
        '<button class="btn sm" id="print">인쇄 · PDF</button>' +
      '</div></div>' +
      (projEdit ? projForm(r) : projView(r)) + body;

    bindProj(r);
    $("he").addEventListener("change", function(){ hideEmpty = this.checked; renderMain(); });
    $("print").addEventListener("click", function(){ window.print(); });
    $("copen").addEventListener("click", function(){
      window.open(linkFor(r), "_blank", "noopener,noreferrer");
    });
    $("clink").addEventListener("click", function(){ copyText(linkFor(r), $("clink"), "링크 복사"); });
    $("copy").addEventListener("click", function(){ copyText(asText(r, use), $("copy"), "글로 복사"); });
  }

  function copyText(t, btn, label){
    navigator.clipboard.writeText(t).then(function(){
      btn.textContent = "복사됨 ✓";
      setTimeout(function(){ btn.textContent = label; }, 1600);
    }, function(){ alert("복사하지 못했습니다."); });
  }

  function asText(r, use){
    var a = r.answers || {}, out = [];
    out.push(r.company + " — 프로젝트 시작 질문지");
    out.push("마지막 수정 " + when(r.updated_at));
    out.push("");
    var lastMod = null;
    ALL.forEach(function(e){
      if(e.modId !== "closing" && use.indexOf(e.modId) < 0) return;
      var lines = [];
      e.step.qs.forEach(function(q){
        var v = a[q.id];
        var has = Array.isArray(v) ? v.length > 0 : (v != null && String(v).trim() !== "");
        if(!has) return;
        lines.push("Q. " + q.label);
        lines.push("A. " + (Array.isArray(v) ? v.join(" · ") : String(v)));
        lines.push("");
      });
      if(!lines.length) return;
      if(e.mod !== lastMod){ out.push("═══ " + e.mod + " ═══"); out.push(""); lastMod = e.mod; }
      out.push("[ " + e.step.title + " ]");
      out.push("");
      out = out.concat(lines);
    });
    return out.join("\n");
  }

  boot();
})();
</script>
</body>
</html>
